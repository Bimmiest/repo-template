name: Bug report
description: Something does not do what it says it does
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you saw, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest input and the shortest sequence of steps that show the problem.
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Other information
      description: The version or commit, the environment, the logs, and other facts that help to find the cause.
