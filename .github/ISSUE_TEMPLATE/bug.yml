name: Bug report
description: Something behaves differently from what it says it does
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you saw, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest input and sequence that shows it.
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Version or commit, environment, logs, anything else that narrows it down.
